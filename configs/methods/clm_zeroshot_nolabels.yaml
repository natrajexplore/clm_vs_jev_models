# Pure zero-shot: no labeled data at all, the same regime as Jev.
# Accuracy is identical to temp_scaled (temperature never changes the argmax); only calibration differs.
name: clm_zeroshot
variant: no_labels
seed: 0
model: sentence-transformers/all-MiniLM-L6-v2
batch_size: 64
label_template: "{description}"
temperature: 0.05                               # a fixed guess; nothing to fit it on without labels
calibration_size: 0
