[project]
name = "clm-jev-model-comparison"
version = "0.1.0"
description = "Compare a contrastive language model (sentence embeddings) with TypeSafe Jev on text classification"
readme = "README.md"
authors = [
    { email = "natrajexplore@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
clm-jev-model-comparison = "clm_jev_model_comparison:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
