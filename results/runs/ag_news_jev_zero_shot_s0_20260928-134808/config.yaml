task:
  name: ag_news
  hf_path: fancyzhx/ag_news
  text_field: text
  label_field: label
  train_split: train
  test_split: test
  test_size: 500
  seed: 0
  instructions: What is the main topic of this news article?
  labels:
  - key: world
    description: 'World news: international affairs, politics, diplomacy, conflicts'
  - key: sports
    description: 'Sports: games, athletes, teams, competitions'
  - key: business
    description: 'Business: companies, markets, the economy, finance'
  - key: sci_tech
    description: 'Science and technology: computing, the internet, space, research,
      gadgets'
method:
  name: jev
  variant: zero_shot
  seed: 0
  model: jev-latest
  base_url: https://api.typesafe.ai/v1/systemone
  max_concurrency: 8
  timeout_s: 30
  max_retries: 5
  cache: results/cache/jev_cache.jsonl
  price_per_mtok_input: 0.042
